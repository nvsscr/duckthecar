    ctx.fillStyle = 'rgba(43,52,64,0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = C.paper;
    rr(8, 8, W - 16, H - 16, 14); ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.stroke();

    ctx.textBaseline = 'middle';
    bigFont(18);
    ctx.fillStyle = C.ink;
    textLS('DUCKS', 22, 28, 2, 'left', 0, '');
    this.drawFeatherCount(W - 54, 28, 'right');

    // close
    drawButton(L.close, 'X', C.accent);

    for (let i = 0; i < DUCKS.length; i++) {
      const d = DUCKS[i], cell = this.duckCell(i);
      const owned = Save.has(d.id);
      const equipped = s.equipped === d.id;
      const selected = this.menu.sel === d.id;
      ctx.fillStyle = equipped ? '#eaf7dc' : (selected ? '#f2ece0' : '#f7f2e6');
      rr(cell.x + 4, cell.y + 4, cell.w - 8, cell.h - 8, 10); ctx.fill();
      ctx.strokeStyle = selected ? C.ink : 'rgba(43,52,64,0.22)';
      ctx.lineWidth = selected ? 3 : 1.5;
      rr(cell.x + 4, cell.y + 4, cell.w - 8, cell.h - 8, 10); ctx.stroke();

      const cx = cell.x + cell.w / 2, cy = cell.y + 44;
      const reveal = this.menu.reveal > 0 && this.menu.revealId === d.id
        ? 1 + Math.sin((1 - this.menu.reveal / 1.1) * Math.PI) * 0.5 : 1;
      drawDuck(cx, cy, 0, this.time * 3 + i, 0.95 * reveal, owned ? 1 : 0.3, d.id);

      setFont(10);
      ctx.fillStyle = owned ? C.ink : C.mute;
      textLS(d.name, cx, cell.y + 72, 0.6, 'center', 0, '');
      setFont(9, 400);
      if (equipped) {
        ctx.fillStyle = '#3f9e4d';
        textLS('EQUIPPED', cx, cell.y + 86, 0.4, 'center', 0, '');
      } else if (owned) {
        ctx.fillStyle = C.mute;
        textLS('owned', cx, cell.y + 86, 0.4, 'center', 0, '');
      } else if (d.need) {
        ctx.fillStyle = C.mute;
        textLS('locked', cx, cell.y + 86, 0.4, 'center', 0, '');
      } else {
        const can = s.feathers >= d.cost;
        ctx.fillStyle = can ? C.ink : C.mute;
        const t = String(d.cost);
        const w = textWidth(t, 0.4);
        drawFeather(cx - w / 2 - 6, cell.y + 86, 0.8, can ? '#dfeaf2' : '#e6e2d6');
        textLS(t, cx - w / 2 + 3, cell.y + 86, 0.4, 'left', 0, '');
      }
    }

    // selection detail + action
    const sel = DUCKS.find(x => x.id === this.menu.sel);
    if (sel) {
      const owned = Save.has(sel.id);
      setFont(11, 400);
      ctx.fillStyle = C.mute;
      const info = owned ? (s.equipped === sel.id ? 'Your current duck' : 'Tap equip to wear it')
                 : (sel.need ? sel.needText : 'Costs ' + sel.cost + ' feathers');
      textLS(info, W / 2, 380, 0.4, 'center', 0, '');

      let label = 'EQUIP', fill = C.blue;
      if (!owned) {
        if (sel.need) { label = 'LOCKED'; fill = '#b9b3a4'; }
        else if (s.feathers < sel.cost) { label = 'NEED ' + (sel.cost - s.feathers); fill = '#b9b3a4'; }
        else { label = 'BUY'; fill = '#3f9e4d'; }
      } else if (s.equipped === sel.id) { label = 'WEARING'; fill = '#8fbf6a'; }
      drawButton(L.action, label, fill);
    }

    drawButton(L.sound, s.sound ? 'SOUND ON' : 'SOUND OFF', s.sound ? C.blue : '#b9b3a4');
    drawButton(L.haptic, s.haptics ? 'BUZZ ON' : 'BUZZ OFF', s.haptics ? C.blue : '#b9b3a4');

    // quiet stats footer
    setFont(9, 400);
    ctx.fillStyle = C.mute;
    textLS('runs ' + s.runs + '   roads ' + s.totalRoads + '   rescued ' + s.totalRescued +
           '   close calls ' + s.totalNear, W / 2, 480, 0.3, 'center', 0, '');

    if (this.menu.reveal > 0) {
      const k = 1 - this.menu.reveal / 1.1;
      ctx.save();
      ctx.globalAlpha = (1 - k) * 0.9;
      setFont(16);
      ctx.fillStyle = C.gold;
      textLS('NEW DUCK!', W / 2, 60, 2, 'center', 4, C.ink);
      ctx.fillStyle = C.gold;
      textLS('NEW DUCK!', W / 2, 60, 2, 'center', 0, '');
      ctx.restore();
    }
  }
}

/* ============================================================
   INPUT
   ============================================================ */
const game = new Game();

function canvasX(clientX) {
  const r = cv.getBoundingClientRect();
  return (clientX - r.left) * (W / r.width);
}
function canvasY(clientY) {
  const r = cv.getBoundingClientRect();
  return (clientY - r.top) * (H / r.height);
}
function firstTouch() {
  Sfx.init();
  if (game.state === 'title') game.start();
}

function menuTap(x, y) {
  const L = game.layout();
  if (game.state === 'ducks') {
    if (inBox(L.close, x, y)) { game.closeDucks(); Sfx.coin(); return true; }
    if (inBox(L.action, x, y)) { game.duckAction(); return true; }
    if (inBox(L.sound, x, y)) {
      Save.data.sound = !Save.data.sound; Save.write();
      if (Save.data.sound) Sfx.coin();
      return true;
    }
    if (inBox(L.haptic, x, y)) {
      Save.data.haptics = !Save.data.haptics; Save.write();
      Haptics.buzz(15); return true;
    }
    for (let i = 0; i < DUCKS.length; i++) {
      if (inBox(game.duckCell(i), x, y)) { game.menu.sel = DUCKS[i].id; Sfx.coin(); return true; }
    }
    return true;                                   // swallow taps inside the menu
  }
  if ((game.state === 'title' || game.canRestart) && inBox(L.ducksBtn, x, y)) {
    Sfx.init();
    game.openDucks(game.state === 'title' ? 'title' : 'over');
    return true;
  }
  return false;
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  Sfx.init();
  const x = canvasX(e.clientX), y = canvasY(e.clientY);
  if (menuTap(x, y)) return;
  if (x > W - 40 && y < 42) { Save.data.sound = !Save.data.sound; Save.write(); return; }
  if (game.canRestart) { game.restart(); return; }
  if (game.state === 'crash') return;
  firstTouch();
  game.dragActive = true;
  game.dragX = x;
  game.dragGrab = clamp(game.duck.x - x, -70, 70);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
}, { passive: false });

cv.addEventListener('pointermove', e => {
  if (!game.dragActive) return;
  e.preventDefault();
  game.dragX = canvasX(e.clientX);
}, { passive: false });

function endDrag() { game.dragActive = false; }
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') endDrag(); });

stage.addEventListener('pointerdown', e => {
  if (e.target === cv || track.contains(e.target) || e.target.id === 'nameIn') return;
  Sfx.init();
  if (game.canRestart) game.restart();
});

function knobFromClient(clientX) {
  const r = track.getBoundingClientRect();
  const rel = (clientX - r.left) / r.width * 2 - 1;
  return clamp(rel * 1.18, -1, 1);
}
track.addEventListener('pointerdown', e => {
  e.preventDefault();
  Sfx.init();
  if (game.state === 'ducks') return;
  if (game.canRestart) { game.restart(); return; }
  if (game.state === 'crash') return;
  firstTouch();
  game.knobActive = true;
  game.knobVal = knobFromClient(e.clientX);
  try { track.setPointerCapture(e.pointerId); } catch (err) {}
}, { passive: false });
track.addEventListener('pointermove', e => {
  if (!game.knobActive) return;
  e.preventDefault();
  game.knobVal = knobFromClient(e.clientX);
}, { passive: false });
function endKnob() { game.knobActive = false; }
track.addEventListener('pointerup', endKnob);
track.addEventListener('pointercancel', endKnob);

window.addEventListener('keydown', e => {
  if (document.activeElement && document.activeElement.id === 'nameIn') return;
  const k = e.key;
  const isLeft  = k === 'ArrowLeft'  || k === 'a' || k === 'A';
  const isRight = k === 'ArrowRight' || k === 'd' || k === 'D';
  const isGo    = k === ' ' || k === 'Spacebar' || k === 'Enter';
  if (isLeft || isRight || isGo || k === 'ArrowUp' || k === 'ArrowDown') e.preventDefault();
  if (k === 'm' || k === 'M') { Sfx.init(); Save.data.sound = !Save.data.sound; Save.write(); return; }
  if (game.state === 'ducks') {
    if (k === 'Escape' || isGo) game.closeDucks();
    return;
  }
  if (k === 'Escape' && (game.state === 'title' || game.canRestart)) {
    game.openDucks(game.state === 'title' ? 'title' : 'over');
    return;
  }
  if (isLeft || isRight || isGo) {
    Sfx.init();
    if (game.canRestart) { game.restart(); return; }
    if (isLeft || isRight) firstTouch();
  }
  if (isLeft)  game.keys.left = true;
  if (isRight) game.keys.right = true;
}, { passive: false });

window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') game.keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') game.keys.right = false;
});

window.addEventListener('blur', () => { game.keys.left = game.keys.right = false; endDrag(); endKnob(); });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => {
  if (e.target && e.target.id === 'nameIn') return;
  e.preventDefault();
}, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

/* name box, only when a world board is switched on */
(function setupName() {
  if (!Board.on) return;
  const wrap = document.getElementById('nameWrap');
  const input = document.getElementById('nameIn');
  let saved = '';
  try { saved = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}
  if (!saved) saved = 'DUCK' + Math.floor(Math.random() * 9000 + 1000);
  Board.name = saved;
  input.value = saved;
  wrap.style.display = 'flex';
  input.addEventListener('input', () => {
    const v = input.value.replace(/[^A-Za-z0-9_ ]/g, '').slice(0, 12);
    input.value = v;
    Board.name = v || 'DUCK';
    try { localStorage.setItem(NAME_KEY, Board.name); } catch (e) {}
  });
  Board.load();
})();

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = 0;
document.addEventListener('visibilitychange', () => { last = 0; });

function frame(now) {
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt > 0) game.update(dt);
  game.draw();
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
