  /* Titan One is the chunky arcade display face, Fredoka the rounded UI face.
     Both fall back to system fonts if the page is opened with no connection. */
  :root{
    --display-font: "Titan One", "Arial Black", "Trebuchet MS", sans-serif;
    --ui-font: "Fredoka", "Trebuchet MS", Verdana, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:#eef0e8;overflow:hidden;
    font-family:var(--ui-font);
    -webkit-user-select:none;-moz-user-select:none;user-select:none;
    overscroll-behavior:none;touch-action:none;
  }
  #stage{
    position:absolute;left:50%;top:50%;
    width:420px;height:700px;
    transform:translate(-50%,-50%) scale(var(--s,1));
    transform-origin:50% 50%;
    display:flex;flex-direction:column;gap:9px;padding:9px;
  }
  .panel{
    border:3px solid #2b3440;border-radius:12px;background:#fff;
    box-shadow:0 3px 0 rgba(43,52,64,.16);
    position:relative;
  }
  .head{
    height:72px;background:#79cdf0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .head h1{
    margin:0;font-family:var(--display-font);font-size:24px;font-weight:400;
    letter-spacing:1px;line-height:1;color:#fff;
    /* a thin outline plus one hard drop shadow. Eight shadow layers went muddy
       and pushed the glyph tops into the panel border. */
    text-shadow:-1.5px 0 #16394f,1.5px 0 #16394f,0 -1.5px #16394f,0 1.5px #16394f,
                3px 3px 0 rgba(18,48,66,.45);
  }
  .head p{
    margin:0;font-size:10.5px;font-weight:600;line-height:1;letter-spacing:.4px;
    color:#0f4258;text-align:center;
  }
  .game{height:510px;padding:0;overflow:hidden;background:#a4d84a;}
  #cv{display:block;width:396px;height:504px;border-radius:9px;}
  .ctrl{

<body>
<div id="stage">

<script>
(function () {
'use strict';

/* ============================================================
   WORLD LEADERBOARD (optional)
   Leave empty and the game is fully offline. See LEADERBOARD.md.
   ============================================================ */
const LEADERBOARD_URL = '';

/* ============================================================
   BALANCE - every tunable number lives here
   ============================================================ */
const BAL = {
  // rewards
  featherPerRoad:    1,
  featherPerRescue:  5,
  featherPerNear:    1,
  comboBonus:       [0, 0, 2, 4, 7],   // extra feathers at combo 1,2,3,4,5+
  missionReward:    40,
  achievementReward: 25,
  // near miss
  nearGap:        12,      // px of clearance that still counts as "close"
  nearCooldown:   0.55,    // one shout at a time, however many cars
  comboWindow:    2.4,     // seconds to keep a combo alive
  // emergency vehicle event
  ambulanceFrom:   8,      // roads generated before one can appear
  ambulanceChance: 0.14,   // per road
  ambulanceSpeed:  188,
  sirenLead:       1.15    // seconds of siren before it enters the screen
};

/* ============================================================
   CONSTANTS
   ============================================================ */
const W = 396;
const H = 504;
const CAM_ANCHOR = 0.60;
const LANE_H  = 44;
const GRASS_H = 48;
const EDGE    = 15;
const DUCK_W  = 25, DUCK_H = 24;
const HITBOX  = 0.70;
const DK_SCALE = 0.58;
const DK_HW = 4.2, DK_HH = 4.1;    // duckling hitbox half extents - deliberately tiny
const DK_SLOT_K  = 3.2;
const FAMILY_DUR = 0.75;
const ROW_GAP_ROAD = 12, ROW_GAP_GRASS = 20;   // flock spacing
const COL_GAP_ROAD = 13, COL_GAP_GRASS = 16;
const BABY_CAR_H = 0.55, BABY_CAR_W = 0.92;
const MAX_DUCKLINGS = 8;
/* Steering is POSITIONAL, not velocity based. No acceleration, no drift. */
const KEY_SPEED  = 320;
const SNAP_SPEED = 520;
const SNAP_K     = 22;
const FWD_BASE = 78, FWD_MAX = 96;
const GEN_AHEAD  = 340;
const CULL_BELOW = 150;
const ACT_UP = 430, ACT_DOWN = 130;
const KNOB_TRAVEL = 148;   // (track 340 - 2*3 border - 38 knob) / 2
const SAVE_KEY = 'duckTheCar.v1';
const OLD_BEST_KEY = 'duckTheCar.best';
const NAME_KEY = 'duckTheCar.name';
const TAU = Math.PI * 2;

const C = {
  grass:'#a4d84a', grassAlt:'#99cf3f', grassLit:'#bbe870', grassEdge:'#6fa32c',
  road:'#7c8794',  roadAlt:'#74808d',  curb:'#59636f', edge:'rgba(52,58,44,0.32)',
  dash:'#fdf8e7',  centre:'#ffd83d',
  duck:'#ffd233',  duckWing:'#f0a41f', beak:'#ff8b2a', foot:'#ff8b2a',
  line:'#4a3a10',  shade:'rgba(40,44,30,0.18)', carShade:'rgba(38,42,28,0.22)',
  ink:'#2b3440',   paper:'#fffaf0', accent:'#ff5a4d', gold:'#ffc93c', blue:'#4a8fe0',
  mute:'#7d8478'
};
const CAR_COLORS = ['#e8564a','#4a8fe0','#58bb56','#9a6ad6','#f0902a',
                    '#f5f2e6','#3fbfae','#e05a9a','#f5d13b','#ff7a5c'];
const FLOWERS = ['#ffffff','#ffe14d','#ff7fb0','#b98cff','#ff9b3d','#7fe6ff'];
/* Two faces, matching the CSS: a chunky arcade display face for the numbers and
   headlines, a rounded face for everything else. Both list system fallbacks so
   the game still looks right with no connection. */
const FONT_DISPLAY = '"Titan One", "Arial Black", "Trebuchet MS", sans-serif';
const FONT_UI      = '"Fredoka", "Trebuchet MS", Verdana, sans-serif';
const TYPES = {
  car:       {w:42, h:24},
  sedan:     {w:54, h:25},
  van:       {w:68, h:27},
  truck:     {w:92, h:28},
  ambulance: {w:64, h:27}
};

/* ============================================================
   CONTENT - ducks, missions, achievements, death lines
   ============================================================ */
const DUCKS = [
  { id:'classic', name:'CLASSIC', cost:0 },
  { id:'cap',     name:'CAP',     cost:150 },
  { id:'shades',  name:'SHADES',  cost:350 },
  { id:'chef',    name:'CHEF',    cost:600 },
  { id:'crown',   name:'KING',    cost:1000 },
  { id:'ninja',   name:'NINJA',   cost:1500 },
  { id:'pirate',  name:'PIRATE',  need:'parent10', needText:'Rescue 10 ducklings' },
  { id:'danger',  name:'DANGER',  need:'danger5',  needText:'5 near misses in a run' },
  { id:'ghost',   name:'GHOST',   need:'road50',   needText:'Reach 50 roads' }
];

const MISSION_POOL = [
  { id:'s30',  text:'Reach 30 roads',        goal:30, kind:'runScore' },
  { id:'s60',  text:'Reach 60 roads',        goal:60, kind:'runScore' },
  { id:'r2',   text:'Rescue 2 in one run',   goal:2,  kind:'runRescued' },
  { id:'r3',   text:'Rescue 3 in one run',   goal:3,  kind:'runRescued' },
  { id:'n4',   text:'4 near misses in a run',goal:4,  kind:'runNear' },
  { id:'n7',   text:'7 near misses in a run',goal:7,  kind:'runNear' },
  { id:'c3',   text:'Hit a x3 close combo',  goal:3,  kind:'runCombo' },
  { id:'t45',  text:'Survive 45 seconds',    goal:45, kind:'runTime' },
  { id:'tr150',text:'Cross 150 roads total', goal:150,kind:'totalRoads' },
  { id:'tf10', text:'Rescue 10 ducklings',   goal:10, kind:'totalRescued' },
  { id:'pb',   text:'Beat your best score',  goal:1,  kind:'beatBest' }
];

const ACHIEVEMENTS = [
  { id:'first10',  text:'Reach 10 roads',            check:(s)   => s.best >= 10 },
  { id:'road50',   text:'Reach 50 roads',            check:(s)   => s.best >= 50 },
  { id:'road150',  text:'Reach 150 roads',           check:(s)   => s.best >= 150 },
  { id:'parent10', text:'Rescue 10 ducklings',       check:(s)   => s.totalRescued >= 10 },
  { id:'family50', text:'Rescue 50 ducklings',       check:(s)   => s.totalRescued >= 50 },
  { id:'danger5',  text:'5 near misses in one run',  check:(s,r) => r.nearMiss >= 5 },
  { id:'maniac10', text:'10 near misses in one run', check:(s,r) => r.nearMiss >= 10 },
  { id:'soclose',  text:'Die one road from your best', check:(s,r) => r.soClose }
];

const DEATH_LINES = [
  'LOOK BOTH WAYS.', 'ROAD WINS.', 'HONK HONK.', 'THE CAR HAD PRIORITY.',
  'OOPS.', 'ALMOST.', 'NOT YOUR BEST IDEA.', 'DUCK 0 - CAR 1.',
  'MAYBE DONT DO THAT.', 'THAT WAS AVOIDABLE.'
];

/* ============================================================
   SMALL HELPERS
   ============================================================ */
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const railToX = r => W / 2 + clamp(r, -1, 1) * (W / 2 - EDGE);
const lerp  = (a,b,t) => a + (b-a) * t;
const rand  = (a,b) => a + Math.random() * (b-a);
const randInt = (a,b) => Math.floor(rand(a, b+1));
const pick  = arr => arr[(Math.random()*arr.length)|0];
const num   = (v, d) => Number.isFinite(+v) ? +v : d;

/* ============================================================
   SAVE - one object, never lets a bad value stop the game
   ============================================================ */
const Save = {
  data: null,
  defaults() {
    return {
      best: 0, feathers: 0, runs: 0,
      totalRoads: 0, totalRescued: 0, totalLost: 0, totalNear: 0, bestCombo: 0,
      unlocked: ['classic'], equipped: 'classic',
      missions: [], achievements: [],
      sound: true, haptics: true
    };
  },
  load() {
    const d = this.defaults();
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && typeof p === 'object') for (const k in d) if (p[k] !== undefined && p[k] !== null) d[k] = p[k];
      } else {
        const old = parseInt(localStorage.getItem(OLD_BEST_KEY) || '0', 10);
        if (old > 0) d.best = old;                 // migrate the old best-only save
      }
    } catch (e) { /* corrupt or blocked storage: defaults keep it playable */ }

    // sanity pass - a broken field must never break the game
    d.best = Math.max(0, Math.floor(num(d.best, 0)));
    d.feathers = Math.max(0, Math.floor(num(d.feathers, 0)));
    d.runs = Math.max(0, Math.floor(num(d.runs, 0)));
    d.totalRoads = Math.max(0, Math.floor(num(d.totalRoads, 0)));
    d.totalRescued = Math.max(0, Math.floor(num(d.totalRescued, 0)));
    d.totalLost = Math.max(0, Math.floor(num(d.totalLost, 0)));
    d.totalNear = Math.max(0, Math.floor(num(d.totalNear, 0)));
    d.bestCombo = Math.max(0, Math.floor(num(d.bestCombo, 0)));
    if (!Array.isArray(d.unlocked)) d.unlocked = ['classic'];
    d.unlocked = d.unlocked.filter(id => DUCKS.some(x => x.id === id));
    if (d.unlocked.indexOf('classic') < 0) d.unlocked.push('classic');
    if (!DUCKS.some(x => x.id === d.equipped) || d.unlocked.indexOf(d.equipped) < 0) d.equipped = 'classic';
    if (!Array.isArray(d.achievements)) d.achievements = [];
    d.achievements = d.achievements.filter(id => ACHIEVEMENTS.some(a => a.id === id));
    if (!Array.isArray(d.missions)) d.missions = [];
    d.missions = d.missions
      .filter(m => m && MISSION_POOL.some(p => p.id === m.id))
      .map(m => ({ id: m.id, prog: Math.max(0, Math.floor(num(m.prog, 0))) }));
    this.data = d;
    this.refillMissions();
    return d;
  },
  write() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) {} },
  refillMissions() {
    const d = this.data;
    let guard = 0;
    while (d.missions.length < 3 && guard++ < 30) {
      const open = MISSION_POOL.filter(p => !d.missions.some(m => m.id === p.id));
      if (!open.length) break;
      d.missions.push({ id: pick(open).id, prog: 0 });
    }
  },
  missionDef(id) { return MISSION_POOL.find(p => p.id === id); },
  has(id) { return this.data.unlocked.indexOf(id) >= 0; }
};
Save.load();

/* ============================================================
   HAPTICS - tiny, optional, silently absent where unsupported
   ============================================================ */
const Haptics = {
  buzz(ms) {
    if (!Save.data.haptics) return;
    try { if (navigator && navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }
};

/* ============================================================
   CANVAS
   ============================================================ */
const stage = document.getElementById('stage');
const cv    = document.getElementById('cv');
const ctx   = cv.getContext('2d');
const track = document.getElementById('track');
const knob  = document.getElementById('knob');
let viewScaleX = 1, viewScaleY = 1;

function resize() {
  const vw = Math.max(200, window.innerWidth || 420);
  const vh = Math.max(320, window.innerHeight || 700);
  const s = Math.max(0.25, Math.min((vw - 4) / 420, (vh - 4) / 700, 1.35));
  stage.style.setProperty('--s', s);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const px = Math.max(1, Math.round(W * s * dpr));
  const py = Math.max(1, Math.round(H * s * dpr));
  if (cv.width !== px || cv.height !== py) { cv.width = px; cv.height = py; }
  viewScaleX = px / W; viewScaleY = py / H;
  ctx.setTransform(viewScaleX, 0, 0, viewScaleY, 0, 0);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

function rr(x, y, w, h, r) {
  const rad = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rad, y);
  ctx.lineTo(x+w-rad, y);   ctx.arcTo(x+w, y, x+w, y+rad, rad);
  ctx.lineTo(x+w, y+h-rad); ctx.arcTo(x+w, y+h, x+w-rad, y+h, rad);
  ctx.lineTo(x+rad, y+h);   ctx.arcTo(x, y+h, x, y+h-rad, rad);
  ctx.lineTo(x, y+rad);     ctx.arcTo(x, y, x+rad, y, rad);
  ctx.closePath();
}
function dot(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function setFont(px, weight) { ctx.font = (weight || 600) + ' ' + px + 'px ' + FONT_UI; }
function bigFont(px) { ctx.font = '400 ' + px + 'px ' + FONT_DISPLAY; }

function textLS(txt, x, y, ls, align, strokeW, strokeCol) {
  txt = String(txt);
  let total = 0;
  for (const ch of txt) total += ctx.measureText(ch).width + ls;
  total -= ls;
  let cx = align === 'center' ? x - total/2 : align === 'right' ? x - total : x;
  const prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  if (strokeW) {
    ctx.save();
    ctx.lineWidth = strokeW; ctx.strokeStyle = strokeCol; ctx.lineJoin = 'round';
    let sx = cx;
    for (const ch of txt) { ctx.strokeText(ch, sx, y); sx += ctx.measureText(ch).width + ls; }
    ctx.restore();
  }
  for (const ch of txt) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + ls; }
  ctx.textAlign = prevAlign;
  return total;
}
function textWidth(txt, ls) {
  let total = 0;
  for (const ch of String(txt)) total += ctx.measureText(ch).width + ls;
  return total - ls;
}

/* ============================================================
   AUDIO
   ============================================================ */
const Sfx = {
  ac: null, master: null,
  get muted() { return !Save.data.sound; },
  set muted(v) { Save.data.sound = !v; Save.write(); },
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ac.destination);
    } catch (e) { this.ac = null; }
  },
  tone(f1, f2, dur, type, vol, delay) {
    if (!this.ac || this.muted) return;
    const t0 = this.ac.currentTime + (delay || 0);
    const o = this.ac.createOscillator();
    const g = this.ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t0);
    if (f2 && f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  },
  noise(dur, vol, freq, sweep) {
    if (!this.ac || this.muted) return;
    const t0 = this.ac.currentTime;
    const n = Math.floor(this.ac.sampleRate * dur);
    const buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const f = this.ac.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(freq, t0);
    if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(60, sweep), t0 + dur);
    const g = this.ac.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  },
  cross()   { this.tone(620, 660, 0.09, 'sine', 0.05, 0);
              this.tone(930, 990, 0.11, 'sine', 0.045, 0.06); },
  whoosh(v) { this.noise(0.16, v || 0.028, 2000, 240); },
  near(n)   { this.whoosh(0.05);
              this.tone(330 + n * 90, 230 + n * 70, 0.09, 'triangle', 0.022, 0); },
  peep()    { this.tone(1480, 1720, 0.045, 'triangle', 0.017, 0); },
  chick()   { this.tone(720, 760, 0.06, 'triangle', 0.05, 0);
              this.tone(960, 1000, 0.06, 'triangle', 0.05, 0.055);
              this.tone(1240, 1300, 0.09, 'triangle', 0.045, 0.11); },
  babyHit() { this.noise(0.09, 0.07, 1200, 300);
              this.tone(880, 400, 0.20, 'triangle', 0.05, 0.03);
              this.tone(600, 300, 0.16, 'sine', 0.028, 0.07); },
  crash()   { this.noise(0.22, 0.16, 900, 120);
              this.tone(150, 52, 0.28, 'square', 0.07, 0); },
  record()  { this.tone(760, 800, 0.09, 'triangle', 0.05, 0);
              this.tone(1010, 1060, 0.09, 'triangle', 0.05, 0.07);
              this.tone(1520, 1590, 0.17, 'triangle', 0.045, 0.14); },
  /* two-tone siren, played while the ambulance is still off screen */
  siren()   { for (let i = 0; i < 3; i++) {
                this.tone(740, 740, 0.16, 'square', 0.026, i * 0.34);
                this.tone(560, 560, 0.16, 'square', 0.026, i * 0.34 + 0.17);
              } },
  mission() { this.tone(880, 920, 0.07, 'triangle', 0.045, 0);
              this.tone(1320, 1380, 0.12, 'triangle', 0.04, 0.07); },
  coin()    { this.tone(1180, 1240, 0.05, 'triangle', 0.03, 0); },
  unlock()  { this.noise(0.07, 0.05, 2200, 600);
              this.tone(520, 560, 0.08, 'triangle', 0.05, 0.05);
              this.tone(780, 820, 0.08, 'triangle', 0.05, 0.13);
              this.tone(1170, 1230, 0.20, 'triangle', 0.05, 0.21); },
  quack()   { this.tone(420, 300, 0.13, 'sawtooth', 0.035, 0); }
};

/* ============================================================
   ENTITIES
   ============================================================ */
let vehSeq = 0;
class Vehicle {
  constructor(type, x, dir, color) {
    const t = TYPES[type];
    this.type = type; this.w = t.w; this.h = t.h;
    this.x = x; this.dir = dir; this.color = color;
    this.id = ++vehSeq;
    this.near = false;
    this.emergency = (type === 'ambulance');
  }
}

class Lane {
  constructor(top, dir, speed, d, sparse) {
    this.top = top;
    this.cy = top + LANE_H / 2;
    this.dir = dir;
    this.speed = speed;
    this.gapMin = d.gapMin; this.gapMax = d.gapMax;
    this.bigChance = d.bigChance;
    this.speedNorm = d.speedMax > d.speedMin
      ? clamp((speed - d.speedMin) / (d.speedMax - d.speedMin), 0, 1) : 0.5;
    this.sparse = sparse ? 1.75 : 1;
    this.vehicles = [];
    this.emergencyPending = false;   // set by the world when an ambulance is due
    this.nextGap = this.rollGap();
    this.prefill();
  }
  rollGap() {
    const base = clamp(this.speed * 1.75, this.gapMin, this.gapMax);
    return base * (0.95 + Math.random() * 0.8) * this.sparse;
  }
  /* Big vehicles are never the quick ones: fast lanes carry only small cars,
     trucks are reserved for slow lanes so they read from far away. */
  makeType() {
    const f = this.speedNorm;
    if (f > 0.66) return Math.random() < 0.62 ? 'car' : 'sedan';
    if (Math.random() < this.bigChance * (f < 0.40 ? 1.6 : 1)) {
      return (f < 0.40 && Math.random() < 0.55) ? 'truck' : 'van';
    }
    return Math.random() < 0.5 ? 'car' : 'sedan';
  }
  colorFor(type) {
    if (type === 'ambulance') return '#f7f4ea';
    if (type === 'truck') return Math.random() < 0.6 ? '#f5f2e6' : '#f5d13b';
    return pick(CAR_COLORS);
  }
  prefill() {
    let edge = this.dir > 0 ? -10 + rand(0, this.nextGap) : W + 10 - rand(0, this.nextGap);
    let guard = 0;
    while (guard++ < 24) {
      const type = this.makeType();
      const t = TYPES[type];
      let x;
      if (this.dir > 0) { x = edge + t.w/2; edge = x + t.w/2 + this.rollGap(); if (x - t.w/2 > W + 70) break; }
      else              { x = edge - t.w/2; edge = x - t.w/2 - this.rollGap(); if (x + t.w/2 < -70) break; }
      this.vehicles.push(new Vehicle(type, x, this.dir, this.colorFor(type)));
    }
    this.nextGap = this.rollGap();
  }
  trySpawn(game) {
    let gapAvail;
    if (this.vehicles.length === 0) gapAvail = Infinity;
    else if (this.dir > 0) {
      let minL = Infinity;
      for (const v of this.vehicles) minL = Math.min(minL, v.x - v.w/2);
      gapAvail = minL + 10;
    } else {
      let maxR = -Infinity;
      for (const v of this.vehicles) maxR = Math.max(maxR, v.x + v.w/2);
      gapAvail = (W - maxR) + 10;
    }
    if (gapAvail < this.nextGap) return;

    // an ambulance starts far enough off screen that the siren lands first
    if (this.emergencyPending) {
      this.emergencyPending = false;
      const t = TYPES.ambulance;
      const lead = BAL.sirenLead * BAL.ambulanceSpeed;
      const x = this.dir > 0 ? -t.w/2 - 10 - lead : W + t.w/2 + 10 + lead;
      const v = new Vehicle('ambulance', x, this.dir, this.colorFor('ambulance'));
      this.vehicles.push(v);
      this.nextGap = this.rollGap() * 1.4;
      if (game) game.onSiren(this);
      return;
    }

    const type = this.makeType();
    const t = TYPES[type];
    const x = this.dir > 0 ? -t.w/2 - 10 : W + t.w/2 + 10;
    this.vehicles.push(new Vehicle(type, x, this.dir, this.colorFor(type)));
    this.nextGap = this.rollGap();
  }
  update(dt, game) {
    const vs = this.vehicles;
    for (let i = vs.length - 1; i >= 0; i--) {
      const v = vs[i];
      const sp = v.emergency ? BAL.ambulanceSpeed : this.speed;
      v.x += sp * this.dir * dt;
      const gone = this.dir > 0 ? (v.x - v.w/2 > W + 70) : (v.x + v.w/2 < -70);
      if (gone) vs.splice(i, 1);
    }
    this.trySpawn(game);
  }
}

class Section {
  constructor(kind, top, height) {
    this.kind = kind;
    this.top = top;
    this.h = height;
    this.bottom = top + height;
    this.lanes = [];
    this.details = [];
    this.duckling = null;
    this.scored = false;
  }
}

class Duckling {
  constructor(x, y) {
    this.x = x || 0; this.y = y || 0;
    this.slot = 1;
    this.phase = Math.random() * TAU;
    this.bobRate = 6.1 + Math.random() * 1.2;
    this.follow = 9 + Math.random() * 4;    // its own eagerness, so they never move in lockstep
    this.wob = Math.random() * TAU;
    this.tilt = 0;
    this.hop = 0;
    this.hopWait = rand(0.6, 1.8);
    this.dangerT = 0;
    this.dangerCd = 0;
    this.lastScare = 0;
    this.greeted = false;
  }
}

class KnockedDuckling {
  constructor(x, y, dir) {
    this.x = x; this.y = y;
    this.vx = dir * rand(170, 260);
    this.vy = rand(25, 80);
    this.angle = 0;
    this.spin = dir * rand(13, 19);
    this.t = 0;
    this.life = rand(0.42, 0.58);
    this.phase = Math.random() * TAU;
    this.puff = 0.08;
  }
  update(dt) {
    this.t += dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vx *= (1 - Math.min(0.9, 1.1 * dt));
    this.vy *= (1 - Math.min(0.9, 1.7 * dt));
    this.angle += this.spin * dt;
  }
  get dead() { return this.t >= this.life; }
  get alpha() {
    const k = this.t / this.life;
    return k < 0.62 ? 1 : Math.max(0, 1 - (k - 0.62) / 0.38);
  }
}

class Particle {
  constructor(x, y, vx, vy, life, size, color, kind) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.t = 0; this.size = size; this.color = color;
    this.kind = kind || 'dust';
    this.rot = Math.random() * TAU;
    this.spin = rand(-7, 7);
  }
  update(dt) {
    this.t += dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    const drag = 1 - Math.min(0.9, 2.6 * dt);
    this.vx *= drag; this.vy *= drag;
    this.rot += this.spin * dt;
  }
  get dead() { return this.t >= this.life; }
}

class Duck {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = 0;
    this.phase = 0;
    this.tilt = 0;
    this.angle = 0;
    this.spin = 0;
    this.knockY = 0;
    this.startle = 0;      // eyes widen briefly on a close pass
    this.cheer = 0;        // tiny happy pose after a rescue
    this.idle = 0;         // how long the player has not steered
  }
  get hw() { return DUCK_W * HITBOX / 2; }
  get hh() { return DUCK_H * HITBOX / 2; }
  move(dt, cmd) {
    const prev = this.x;
    if (cmd.mode === 'pos') {
      const diff = cmd.x - this.x;
      let step = clamp(diff * SNAP_K, -SNAP_SPEED, SNAP_SPEED) * dt;
      if (Math.abs(step) > Math.abs(diff)) step = diff;
      this.x += step;
    } else if (cmd.mode === 'dir') {
      this.x += cmd.dir * KEY_SPEED * dt;
    }
    this.x = clamp(this.x, EDGE, W - EDGE);
    this.vx = dt > 0 ? (this.x - prev) / dt : 0;
    this.tilt += ((this.vx / SNAP_SPEED) * 0.30 - this.tilt) * Math.min(1, 16 * dt);
    this.idle = Math.abs(this.vx) > 6 ? 0 : this.idle + dt;
  }
  get railPos() { return (this.x - W / 2) / (W / 2 - EDGE); }
  waddle(dt, moving) {
    const rate = moving ? (5.2 + Math.abs(this.vx) / 70) : 2.4;
    this.phase += dt * rate;
    this.startle = Math.max(0, this.startle - dt * 1.6);
    this.cheer = Math.max(0, this.cheer - dt * 1.4);
  }
}

/* ============================================================
   WORLD
   ============================================================ */
class World {
  constructor(startY) {
    this.sections = [];
    this.roadsMade = 0;
    this.nextDucklingAt = 4 + randInt(0, 1);
    this.liveDucklings = 0;
    const first = new Section('grass', startY - 168, 448);
    this.decorate(first);
    this.sections.push(first);
    this.frontier = first.top;
  }

  difficulty() {
    const n = Math.max(0, this.roadsMade - 4);
    const t  = clamp(n / 34, 0, 1);
    const t2 = clamp((n - 30) / 40, 0, 1);
    return {
      lanesMin: n < 8 ? 2 : 3,
      lanesMax: n < 8 ? 3 : (n < 18 ? 4 : 5),
      speedMin: lerp(46, 68, t) + 5 * t2,
      speedMax: Math.min(130, lerp(80, 116, t) + 12 * t2),
      gapMin:   Math.max(158, lerp(226, 178, t) - 8 * t2),
      gapMax:   Math.max(232, lerp(376, 292, t) - 16 * t2),
      bigChance: n < 6 ? 0.10 : (n < 16 ? 0.26 : 0.38),
      doubleGrass: n < 5 ? 0.5 : (n < 15 ? 0.28 : 0.15)
    };
  }

  decorate(sec) {
    const n = Math.round(sec.h / 9);
    for (let i = 0; i < n; i++) {
      const r = Math.random();
      sec.details.push({
        x: rand(6, W - 6),
        y: rand(4, sec.h - 4),
        t: r < 0.44 ? 'blade' : (r < 0.90 ? 'flower' : 'rock'),
        c: r < 0.44 ? C.grassLit : (r < 0.90 ? pick(FLOWERS) : '#b9bcae'),
        s: rand(2.0, 3.4),
        a: rand(-0.5, 0.5)
      });
    }
  }

  generateAbove() {
    const prev = this.sections[this.sections.length - 1];
    const d = this.difficulty();
    let sec;
    if (prev.kind === 'road') {
      const tall = Math.random() < d.doubleGrass;
      sec = new Section('grass', this.frontier - (tall ? GRASS_H * 2 : GRASS_H), tall ? GRASS_H * 2 : GRASS_H);
      this.decorate(sec);
      if (this.roadsMade >= this.nextDucklingAt) {
        let waiting = 0;
        for (const s of this.sections) if (s.duckling) waiting++;
        if (this.liveDucklings + waiting >= MAX_DUCKLINGS) {
          this.nextDucklingAt = this.roadsMade + 2;
        } else {
          this.nextDucklingAt = this.roadsMade + 4 + randInt(0, 2);
          sec.duckling = new Duckling(rand(52, W - 52), sec.top + sec.h / 2);
        }
      }
    } else {
      const lanes = randInt(d.lanesMin, d.lanesMax);
      sec = new Section('road', this.frontier - lanes * LANE_H, lanes * LANE_H);
      const sparse = {};
      if (lanes >= 3) sparse[randInt(0, lanes - 1)] = true;
      if (lanes >= 5) sparse[randInt(0, lanes - 1)] = true;
      let dir = Math.random() < 0.5 ? 1 : -1;
      for (let i = 0; i < lanes; i++) {
        const speed = rand(d.speedMin, d.speedMax);
        sec.lanes.push(new Lane(sec.top + i * LANE_H, dir, speed, d, !!sparse[i]));
        dir = Math.random() < 0.78 ? -dir : dir;
      }
      // rare emergency run, announced by its siren before it enters
      if (this.roadsMade >= BAL.ambulanceFrom && Math.random() < BAL.ambulanceChance) {
        pick(sec.lanes).emergencyPending = true;
      }
      this.roadsMade++;
    }
    this.sections.push(sec);
    this.frontier = sec.top;
  }

  ensure(cam, liveDucklings) {
    this.liveDucklings = liveDucklings || 0;
    let guard = 0;
    while (this.frontier > cam - GEN_AHEAD && guard++ < 40) this.generateAbove();
    while (this.sections.length > 1 && this.sections[0].top > cam + H + CULL_BELOW) this.sections.shift();
  }

  update(dt, cam, game) {
    const lo = cam - ACT_UP, hi = cam + H + ACT_DOWN;
    for (const s of this.sections) {
      if (s.kind !== 'road') continue;
      if (s.bottom < lo || s.top > hi) continue;
      for (const ln of s.lanes) ln.update(dt, game);
    }
  }

  kindAt(y) {
    for (const s of this.sections) if (y >= s.top && y < s.bottom) return s.kind;
    return 'grass';
  }
}

/* ============================================================
   OPTIONAL HAND-MADE ART
   Everything below is drawn with shapes by default, so the game needs no
   files at all. Drop PNGs into assets/ using the names in assets/README.md,
   flip `enabled` to true, and those sprites are used instead. Anything
   missing silently falls back, so a half-finished set is fine.
   ============================================================ */
const ART = {
  enabled: true,
  base: 'assets/',
  // Only list files that actually exist in assets/, otherwise every player's
  // browser fetches a 404 on load. Add a line here as each sprite is drawn.
  // Available keys: duck, duckling, feather, car, sedan, van, truck, ambulance.
  files: {
    duck: 'duck.png'
  },
  img: {},
  load() {
    if (!this.enabled || typeof Image === 'undefined') return;
    const self = this;
    for (const key in this.files) {
      try {
        const im = new Image();
        im.onload = function () { if (im.naturalWidth > 0) self.img[key] = im; };
        im.onerror = function () { /* not supplied yet - keep the drawn version */ };
        im.src = this.base + this.files[key];
      } catch (e) { /* ignore */ }
    }
  },
  get(key) { return this.img[key]; }
};
ART.load();

/* ============================================================
   DRAWING
   ============================================================ */
function drawSection(s, cam) {
  const y = s.top - cam;
  if (y > H || y + s.h < 0) return;
  if (s.kind === 'grass') {
    ctx.fillStyle = C.grass;
    ctx.fillRect(0, y, W, s.h);
    ctx.fillStyle = C.grassAlt;
    for (let by = 0; by < s.h; by += 16) ctx.fillRect(0, y + by, W, 8);
    for (const d of s.details) {
      const dy = y + d.y;
      if (dy < -6 || dy > H + 6) continue;
      if (d.t === 'blade') {
        ctx.save(); ctx.translate(d.x, dy); ctx.rotate(d.a);
        ctx.fillStyle = d.c;
        ctx.fillRect(-0.8, -d.s, 1.6, d.s * 2);
        ctx.restore();
      } else if (d.t === 'flower') {
        ctx.fillStyle = 'rgba(110,140,60,0.45)';
        ctx.fillRect(d.x - 0.5, dy, 1, d.s + 2);
        ctx.fillStyle = d.c;
        dot(d.x, dy, d.s * 0.9);
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        dot(d.x - d.s * 0.25, dy - d.s * 0.25, d.s * 0.3);
      } else {
        ctx.fillStyle = d.c;
        rr(d.x - d.s, dy - d.s * 0.7, d.s * 2, d.s * 1.4, 1.2); ctx.fill();
      }
    }
  } else {
    ctx.fillStyle = C.road;
    ctx.fillRect(0, y, W, s.h);
    ctx.fillStyle = C.roadAlt;
    ctx.fillRect(0, y + 7, W, s.h - 14);
    ctx.fillStyle = C.curb;
    ctx.fillRect(0, y, W, 4);
    ctx.fillRect(0, y + s.h - 4, W, 4);
    ctx.fillStyle = C.edge;
    ctx.fillRect(0, y - 1, W, 2);
    ctx.fillRect(0, y + s.h - 1, W, 2);
    for (let i = 1; i < s.lanes.length; i++) {
      const ly = y + i * LANE_H - 1.5;
      if (ly < -6 || ly > H + 6) continue;
      const opposing = s.lanes[i].dir !== s.lanes[i - 1].dir;
      ctx.fillStyle = opposing ? C.centre : C.dash;
      if (opposing) {
        ctx.fillRect(0, ly, W, 3);
      } else {
        for (let x = 10; x < W - 10; x += 34) ctx.fillRect(x, ly, 18, 3);
      }
    }
  }
}

function drawVehicle(v, sy, time) {
  const w = v.w, h = v.h, hw = w/2, hh = h/2;
  if (v.x + hw < -70 || v.x - hw > W + 70) return;

  const art = ART.get(v.type);
  if (art) {
    ctx.save();
    ctx.translate(v.x, sy);
    ctx.fillStyle = C.carShade;
    rr(-hw + 2, -hh + 4.5, w, h, 6); ctx.fill();
    ctx.scale(v.dir, 1);                       // art faces right, mirrored for the other way
    ctx.drawImage(art, -hw, -hh - 3, w, h + 6);
    ctx.restore();
    return;
  }

  ctx.save();
  ctx.translate(v.x, sy);
  ctx.fillStyle = C.carShade;
  rr(-hw + 2, -hh + 4.5, w, h, 6); ctx.fill();
  ctx.scale(v.dir, 1);

  ctx.fillStyle = '#3a3d42';
  const wx = hw - 12;
  rr(-wx - 5, -hh - 2, 11, 5, 2); ctx.fill();
  rr( wx - 6, -hh - 2, 11, 5, 2); ctx.fill();
  rr(-wx - 5,  hh - 3, 11, 5, 2); ctx.fill();
  rr( wx - 6,  hh - 3, 11, 5, 2); ctx.fill();

  ctx.fillStyle = v.color;
  ctx.strokeStyle = 'rgba(40,42,36,0.55)';
  ctx.lineWidth = 1.4;
  rr(-hw, -hh, w, h, 5); ctx.fill(); ctx.stroke();

  if (v.type === 'truck') {
    ctx.fillStyle = '#f2eee0';
    rr(-hw + 2, -hh + 2, w - 30, h - 4, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(44,46,40,0.3)'; ctx.lineWidth = 1.1; ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    rr(hw - 26, -hh + 3, 16, h - 6, 3); ctx.fill();
    ctx.fillStyle = 'rgba(196,236,250,0.95)';
    rr(hw - 11, -hh + 4.5, 5, h - 9, 2); ctx.fill();
  } else if (v.type === 'ambulance') {
    ctx.fillStyle = '#f7f4ea';
    rr(-hw + 2, -hh + 2, w - 22, h - 4, 4); ctx.fill();
    ctx.fillStyle = C.accent;                        // red side stripe
    ctx.fillRect(-hw + 3, -3, w - 24, 6);
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    rr(hw - 20, -hh + 3, 12, h - 6, 3); ctx.fill();
    ctx.fillStyle = 'rgba(196,236,250,0.95)';
    rr(hw - 9, -hh + 4.5, 5, h - 9, 2); ctx.fill();
    // flashing bar on the roof
    const on = Math.floor(time * 8) % 2 === 0;
    ctx.fillStyle = on ? '#ff3b30' : '#3b6bff';
    rr(-6, -hh + 4, 5, h - 8, 2); ctx.fill();
    ctx.fillStyle = on ? '#3b6bff' : '#ff3b30';
    rr(1, -hh + 4, 5, h - 8, 2); ctx.fill();
  } else {
    const roofIn = v.type === 'van' ? 10 : 13;
    ctx.fillStyle = 'rgba(0,0,0,0.13)';
    rr(-hw + roofIn, -hh + 4.5, w - roofIn * 2, h - 9, 3); ctx.fill();
    ctx.fillStyle = 'rgba(196,236,250,0.95)';
    rr(hw - roofIn - 3.5, -hh + 5.5, 4, h - 11, 1.6); ctx.fill();
    rr(-hw + roofIn - 0.5, -hh + 5.5, 4, h - 11, 1.6); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,246,190,0.95)';
  rr(hw - 4, -hh + 4, 3, 5, 1); ctx.fill();
  rr(hw - 4,  hh - 9, 3, 5, 1); ctx.fill();
  ctx.fillStyle = 'rgba(230,70,60,0.9)';
  rr(-hw + 1, -hh + 4, 3, 5, 1); ctx.fill();
  rr(-hw + 1,  hh - 9, 3, 5, 1); ctx.fill();
  ctx.restore();
}

/* cosmetic hats, drawn in the duck's own space after the head */
function drawSkin(id, step, t) {
  switch (id) {
    case 'cap':
      ctx.fillStyle = '#e8564a'; ctx.strokeStyle = C.line; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, -9.5, 6.2, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#c2453b';
      rr(-7.5, -10.4, 15, 2.6, 1.2); ctx.fill(); ctx.stroke();
      break;
    case 'shades':
      ctx.fillStyle = '#22252b'; ctx.strokeStyle = C.line; ctx.lineWidth = 1;
      rr(-6.4, -9.4, 12.8, 4.2, 1.6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      rr(-5.4, -8.9, 3.4, 1.4, 0.7); ctx.fill();
      break;
    case 'chef':
      ctx.fillStyle = '#fdfaf2'; ctx.strokeStyle = C.line; ctx.lineWidth = 1.2;
      rr(-5.2, -12.4, 10.4, 3.4, 1.2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, -14.6, 6.2, 3.6, 0, 0, TAU); ctx.fill(); ctx.stroke();
      break;
    case 'crown':
      ctx.fillStyle = C.gold; ctx.strokeStyle = C.line; ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(-6, -9.6); ctx.lineTo(-6, -14.4); ctx.lineTo(-3, -11.8);
      ctx.lineTo(0, -15.2); ctx.lineTo(3, -11.8); ctx.lineTo(6, -14.4);
      ctx.lineTo(6, -9.6); ctx.closePath(); ctx.fill(); ctx.stroke();
      break;
    case 'ninja':
      ctx.fillStyle = '#2f3640'; ctx.strokeStyle = C.line; ctx.lineWidth = 1;
      rr(-6.6, -9.8, 13.2, 4, 1.4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2f3640';
      ctx.beginPath(); ctx.moveTo(6, -8.6); ctx.lineTo(12.5, -6.5); ctx.lineTo(6, -5.6);
      ctx.closePath(); ctx.fill();
      break;
    case 'pirate':
      ctx.fillStyle = '#33383f'; ctx.strokeStyle = C.line; ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.arc(0, -9.6, 6.3, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f2efe3'; dot(-2.4, -11.2, 1); dot(2.4, -11.2, 1);
      ctx.fillStyle = '#22252b';
      rr(-6.4, -8.6, 5, 3, 1.2); ctx.fill();
      break;
    case 'danger':
      ctx.fillStyle = '#ff8b2a'; ctx.strokeStyle = C.line; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, -9.4, 6.4, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff2c8';
      ctx.beginPath();
      ctx.moveTo(1.4, -15.6); ctx.lineTo(-2.6, -10.6); ctx.lineTo(0.2, -10.6);
      ctx.lineTo(-1.2, -6.6); ctx.lineTo(3.2, -12); ctx.lineTo(0.4, -12);
      ctx.closePath(); ctx.fill();
      break;
    case 'ghost':
      // handled as a whole-duck tint, nothing to draw on top
      break;
  }
}

function drawDuck(x, y, angle, phase, scale, alpha, skin, startle) {
  const s = scale || 1;
  const ghost = skin === 'ghost';

  const art = ART.get(s < 0.8 ? 'duckling' : 'duck');
  if (art) {
    const hgt = (s < 0.8 ? 22 : 34) * (s < 0.8 ? s / DK_SCALE : s);
    const wid = hgt * (art.naturalWidth / Math.max(1, art.naturalHeight));
    ctx.save();
    ctx.globalAlpha = (alpha === undefined ? 1 : alpha) * (ghost ? 0.62 : 1);
    ctx.translate(x, y);
    ctx.fillStyle = C.shade;
    ctx.beginPath(); ctx.ellipse(0, 8 * s, 10.5 * s, 4 * s, 0, 0, TAU); ctx.fill();
    ctx.rotate(angle || 0);
    const bob = Math.sin(phase * 2) * 0.8 * s;
    ctx.drawImage(art, -wid / 2, -hgt / 2 - 2 + bob, wid, hgt);
    if (skin && skin !== 'classic') { ctx.scale(s, s); drawSkin(skin, Math.sin(phase), phase); }
    ctx.restore();
    return;
  }

  ctx.save();
  ctx.globalAlpha = (alpha === undefined ? 1 : alpha) * (ghost ? 0.62 : 1);
  ctx.translate(x, y);
  ctx.fillStyle = C.shade;
  ctx.beginPath(); ctx.ellipse(0, 8 * s, 10.5 * s, 4 * s, 0, 0, TAU); ctx.fill();
  ctx.rotate(angle || 0);
  ctx.scale(s, s);

  const step = Math.sin(phase);
  const bob  = Math.sin(phase * 2) * 0.8;
  ctx.strokeStyle = C.line;
  ctx.lineWidth = 1.2;

  ctx.fillStyle = C.foot;
  ctx.beginPath();
  ctx.moveTo(-6.6, 6 + step * 1.6); ctx.lineTo(-2.2, 6 + step * 1.6); ctx.lineTo(-4.4, 9.6 + step * 1.6);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(2.2, 6 - step * 1.6); ctx.lineTo(6.6, 6 - step * 1.6); ctx.lineTo(4.4, 9.6 - step * 1.6);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.translate(0, bob);

  const body = ghost ? '#e8f4ff' : C.duck;
  const wing = ghost ? '#c6dcef' : C.duckWing;
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(0, 1.5, 9.6, 9, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = wing;
  ctx.beginPath(); ctx.ellipse(-7.6, 1.8, 3.4, 6, -0.26 + step * 0.14, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse( 7.6, 1.8, 3.4, 6,  0.26 - step * 0.14, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = wing;
  ctx.beginPath(); ctx.ellipse(0, 9.6, 2.6, 1.7, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(0, -6.8, 6.3, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.beak;
  ctx.beginPath();
  ctx.moveTo(-3.8, -12.2);
  ctx.quadraticCurveTo(-4.1, -16.2, 0, -16.2);
  ctx.quadraticCurveTo(4.1, -16.2, 3.8, -12.2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // eyes widen for a moment after a close pass
  const eye = 1.3 + (startle || 0) * 0.9;
  ctx.fillStyle = '#2b2b2b';
  dot(-3.4, -7.6, eye);
  dot( 3.4, -7.6, eye);
  if (skin && skin !== 'classic') drawSkin(skin, step, phase);
  ctx.restore();
}

/* A proper duck feather: pointed vane, a quill sticking out of the bottom and a
   couple of barb splits. The old one was a plain ellipse and read as a grey blob. */
function drawFeather(x, y, s, color) {
  s = s || 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.28);
  ctx.scale(s, s);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  ctx.fillStyle = color || '#ffe9a8';
  ctx.strokeStyle = '#7a5a1e';
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(0, -7.6);
  ctx.bezierCurveTo(4.6, -4.2, 4.2, 2.6, 0.6, 5.6);
  ctx.bezierCurveTo(-4.2, 2.6, -4.6, -4.2, 0, -7.6);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.strokeStyle = '#7a5a1e';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0.1, -6.4); ctx.lineTo(1.5, 8.4); ctx.stroke();   // quill
  ctx.lineWidth = 0.75;
  ctx.strokeStyle = 'rgba(122,90,30,0.6)';
  ctx.beginPath();
  ctx.moveTo(0.1, -2.4); ctx.lineTo(2.9, -0.9);
  ctx.moveTo(0.4, 1.0);  ctx.lineTo(2.9, 2.4);
  ctx.moveTo(-0.1, -2.4); ctx.lineTo(-2.9, -0.9);
  ctx.stroke();
  ctx.restore();
}

function drawParticle(p, cam) {
  const y = p.y - cam;
  if (y < -30 || y > H + 30) return;
  const k = 1 - p.t / p.life;
  ctx.save();
  ctx.globalAlpha = Math.max(0, k);
  if (p.kind === 'ring') {
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 3 * k + 0.5;
    ctx.beginPath();
    ctx.arc(p.x, y, p.size * (1 + (1 - k) * 3.2), 0, TAU);
    ctx.stroke();
  } else if (p.kind === 'feather') {
    ctx.translate(p.x, y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.ellipse(0, 0, p.size * 1.5, p.size * 0.7, 0, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = p.color;
    dot(p.x, y, p.size * (0.4 + k * 0.6));
  }
  ctx.restore();
}

function drawBang(x, y, k) {
  const pop = 1 + (1 - Math.min(1, k * 1.4)) * 0.5;
  ctx.save();
  ctx.globalAlpha = Math.min(1, k * 2.4);
  ctx.translate(x, y);
  ctx.scale(pop, pop);
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  rr(-2.6, -8.4, 5.2, 7.4, 2.2); ctx.fill();
  dot(0, 3.1, 2.5);
  ctx.fillStyle = C.accent;
  rr(-1.5, -7.4, 3, 5.6, 1.4); ctx.fill();
  dot(0, 3.1, 1.5);
  ctx.restore();
}

function drawSpeaker(x, y, muted) {
  ctx.save();
  ctx.globalAlpha = 0.34;
  ctx.fillStyle = C.ink; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(x - 5, y - 2.5); ctx.lineTo(x - 2, y - 2.5); ctx.lineTo(x + 1.5, y - 6);
  ctx.lineTo(x + 1.5, y + 6); ctx.lineTo(x - 2, y + 2.5); ctx.lineTo(x - 5, y + 2.5);
  ctx.closePath(); ctx.fill();
  if (muted) {
    ctx.beginPath(); ctx.moveTo(x + 3.5, y - 4); ctx.lineTo(x + 9, y + 4); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(x + 3, y, 4, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 3, y, 7, -0.8, 0.8); ctx.stroke();
  }
  ctx.restore();
}

function drawChevron(x, y, dir, size, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x - dir * size * 0.5, y - size);
  ctx.lineTo(x + dir * size * 0.5, y);
  ctx.lineTo(x - dir * size * 0.5, y + size);
  ctx.stroke();
  ctx.restore();
}

/* small pill button used by the menus */
function drawButton(b, label, fill, textCol) {
  ctx.fillStyle = 'rgba(20,26,34,0.22)';
  rr(b.x + 2, b.y + 3, b.w, b.h, 8); ctx.fill();
  ctx.fillStyle = fill;
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5;
  rr(b.x, b.y, b.w, b.h, 8); ctx.fill(); ctx.stroke();
  setFont(Math.min(14, b.h * 0.42));
  ctx.textBaseline = 'middle';
  ctx.fillStyle = textCol || '#fff';
  textLS(label, b.x + b.w / 2, b.y + b.h / 2 + 1, 1.2, 'center', 0, '');
}
function inBox(b, x, y) { return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }

/* ============================================================
   WORLD LEADERBOARD CLIENT
   ============================================================ */
const Board = {
  on: !!LEADERBOARD_URL,
  top: null, rank: null, name: '', busy: false,
  load() {
    if (!this.on) return;
    fetch(LEADERBOARD_URL + '/top', { method: 'GET' })
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d && Array.isArray(d.top)) this.top = d.top.slice(0, 5); })
      .catch(() => {});
  },
  submit(score, seconds) {
    if (!this.on || this.busy || !(score > 0)) return;
    this.busy = true;
    fetch(LEADERBOARD_URL + '/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: this.name || 'DUCK', score: score, seconds: Math.round(seconds) })
    })
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        this.busy = false;
        if (!d) return;
        if (Array.isArray(d.top)) this.top = d.top.slice(0, 5);
        if (typeof d.rank === 'number') this.rank = d.rank;
      })
      .catch(() => { this.busy = false; });
  }
};

/* ============================================================
   GAME
   ============================================================ */
class Game {
  constructor() {
    this.state = 'title';
    this.menu = { sel: null, reveal: 0, revealId: null, from: 'title' };
    this.reset(true);
    this.keys = { left: false, right: false };
    this.dragActive = false; this.dragX = 0; this.dragGrab = 0;
    this.knobActive = false; this.knobVal = 0; this.knobShown = 0;
  }

  get best() { return Save.data.best; }
  set best(v) { Save.data.best = Math.max(0, Math.floor(num(v, 0))); }

  reset(firstTime) {
    this.score = 0;
    this.time = 0;
    this.duck = new Duck(W / 2, 0);
    this.cam = this.duck.y - H * CAM_ANCHOR;
    this.world = new World(this.duck.y);
    this.world.ensure(this.cam, 0);
    this.ducklings = [];
    this.knocked = [];
    this.popups = [];
    this.particles = [];
    // everything earned this run, banked exactly once on death
    this.run = { time: 0, rescued: 0, lost: 0, nearMiss: 0, bestCombo: 0,
                 nearFeathers: 0, beatBest: false, soClose: false };
    this.banked = false;
    this.runFeathers = 0;
    this.doneMissions = [];
    this.doneAch = [];
    this.deathLine = '';
    this.shake = 0;
    this.freeze = 0;
    this.deadT = 0;
    this.overlay = firstTime ? 1 : 0;
    this.pop = 0;
    this.nearT = 0;
    this.nearText = 0;
    this.nearLabel = '';
    this.nearCool = 0;
    this.combo = 0;
    this.comboT = 0;
    this.dkPop = 0;
    this.dkHurt = 0;
    this.peepCool = 0;
    this.familyT = 0;
    this.formation = 0;
    this.camPush = 0;
    this.recordT = 0;
    this.beatBest = false;
    this.lastKind = 'grass';
    this.newBest = false;
    this.sent = false;
    this.toast = 0;
    this.toastText = '';
    this.sirenT = 0;
    this.sirenSide = 1;
    this.quackT = 0;
  }

  start() {
    if (this.state !== 'title') return;
    this.state = 'playing';
    this.overlay = 0;
  }
  restart() {
    this.reset(false);
    this.state = 'playing';
  }
  get canRestart() { return this.state === 'over' && this.deadT > 0.42; }

  command() {
    if (this.keys.left && !this.keys.right) return { mode: 'dir', dir: -1 };
    if (this.keys.right && !this.keys.left) return { mode: 'dir', dir: 1 };
    if (this.knobActive) return { mode: 'pos', x: railToX(this.knobVal) };
    if (this.dragActive) return { mode: 'pos', x: clamp(this.dragX + this.dragGrab, EDGE, W - EDGE) };
    return { mode: 'none' };
  }

  say(text) { this.toastText = text; this.toast = 1.6; }

  onSiren(lane) {
    // only shout about it if the player can actually see that road
    const sy = lane.cy - this.cam;
    if (sy < -60 || sy > H + 60) return;
    Sfx.siren();
    this.sirenT = BAL.sirenLead;
    this.sirenSide = lane.dir;
  }

  /* ---------- update ---------- */
  update(dt) {
    this.time += dt;
    this.shake = Math.max(0, this.shake - dt * 2.6);
    this.nearT = Math.max(0, this.nearT - dt);
    this.nearText = Math.max(0, this.nearText - dt);
    this.nearCool = Math.max(0, this.nearCool - dt);
    this.comboT = Math.max(0, this.comboT - dt);
    if (this.comboT <= 0) this.combo = 0;
    this.pop = Math.max(0, this.pop - dt * 3.2);
    this.dkPop = Math.max(0, this.dkPop - dt * 2.6);
    this.dkHurt = Math.max(0, this.dkHurt - dt * 1.7);
    this.familyT = Math.max(0, this.familyT - dt);
    this.camPush = Math.max(0, this.camPush - dt * 3.2);
    this.recordT = Math.max(0, this.recordT - dt * 1.4);
    this.peepCool = Math.max(0, this.peepCool - dt);
    this.toast = Math.max(0, this.toast - dt);
    this.sirenT = Math.max(0, this.sirenT - dt);
    this.quackT = Math.max(0, this.quackT - dt);
    this.menu.reveal = Math.max(0, this.menu.reveal - dt);

    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.update(dt);
      if (p.dead) this.particles.splice(i, 1);
    }
    for (let i = this.knocked.length - 1; i >= 0; i--) {
      const k = this.knocked[i];
      k.update(dt);
      k.puff -= dt;
      if (k.puff <= 0) {
        k.puff = 0.09;
        this.particles.push(new Particle(k.x, k.y, rand(-25, 25), rand(-20, 30),
          rand(0.3, 0.5), rand(1.1, 1.9), Math.random() < 0.7 ? C.duck : C.duckWing, 'feather'));
      }
      if (k.dead) this.knocked.splice(i, 1);
    }
    for (let i = this.popups.length - 1; i >= 0; i--) {
      const p = this.popups[i];
      p.t += dt;
      p.y -= 17 * dt;
      if (p.t >= p.life) this.popups.splice(i, 1);
    }

    const wanted = this.knobActive ? clamp(this.knobVal, -1, 1) : this.duck.railPos;
    this.knobShown += (wanted - this.knobShown) * Math.min(1, 26 * dt);
    knob.style.transform = 'translateX(' + (this.knobShown * KNOB_TRAVEL).toFixed(2) + 'px)';

    if (this.state === 'ducks') return;
    if (this.freeze > 0) { this.freeze -= dt; return; }

    if (this.state === 'title') {
      this.world.update(dt, this.cam, this);
      this.duck.waddle(dt, false);
      this.overlay += (1 - this.overlay) * Math.min(1, 9 * dt);
      return;
    }

    if (this.state === 'crash' || this.state === 'over') {
      this.deadT += dt;
      this.world.update(dt, this.cam, this);
      const d = this.duck;
      d.angle += d.spin * dt;
      d.spin *= (1 - Math.min(0.9, 2.4 * dt));
      d.x = clamp(d.x + d.vx * dt, 12, W - 12);
      d.y += d.knockY * dt;
      d.vx *= (1 - Math.min(0.9, 3.2 * dt));
      d.knockY *= (1 - Math.min(0.9, 3.2 * dt));
      this.updateDucklings(dt, false, false);
      if (this.state === 'crash' && this.deadT > 0.26) this.state = 'over';
      if (this.state === 'over') {
        this.overlay += (1 - this.overlay) * Math.min(1, 8 * dt);
        if (this.overlay > 0.985) this.overlay = 1;
      }
      return;
    }

    /* ----- playing ----- */
    this.run.time += dt;
    const d = this.duck;
    d.move(dt, this.command());
    const fwd = Math.min(FWD_MAX, FWD_BASE + this.score * 0.5);
    d.y -= fwd * dt;
    d.waddle(dt, true);

    // idle duck gets impatient and quacks about it
    if (d.idle > 6 && this.quackT <= 0) { this.quackT = 5; Sfx.quack(); }

    const target = d.y - H * CAM_ANCHOR;
    this.cam += (target - this.cam) * Math.min(1, 7 * dt);
    if (this.cam > target) this.cam = target;

    this.world.ensure(this.cam, this.ducklings.length);
    this.world.update(dt, this.cam, this);

    const kind = this.world.kindAt(d.y);
    if (kind !== this.lastKind) {
      if (kind === 'road') {
        for (let i = 0; i < 6; i++) {
          this.particles.push(new Particle(
            d.x + rand(-6, 6), d.y + 8,
            rand(-40, 40), rand(10, 55), rand(0.28, 0.5), rand(1.6, 3), C.grassLit, 'dust'));
        }
      }
      this.lastKind = kind;
    }

    for (const s of this.world.sections) {
      if (s.kind === 'road' && !s.scored && d.y < s.top) {
        s.scored = true;
        this.score++;
        this.pop = 1;
        this.camPush = 1;
        if (!this.beatBest && this.best > 0 && this.score > this.best) {
          this.beatBest = true;
          this.recordT = 1;
          this.say('NEW BEST!');
          Sfx.record();
          Haptics.buzz(24);
        } else {
          Sfx.cross();
        }
        if (this.ducklings.length > 0 && Math.random() < 0.34) {
          this.familyT = FAMILY_DUR;
          for (let i = 0; i < this.ducklings.length; i++) this.ducklings[i].hopWait = 0.05 + i * 0.07;
        }
      }
    }

    this.updateDucklings(dt, true, true);
    this.updateWaiting(dt);
    this.collisions();
  }

  updateWaiting(dt) {
    const d = this.duck;
    for (const s of this.world.sections) {
      const dk = s.duckling;
      if (!dk) continue;
      dk.phase += dt * 2.6;
      dk.hopWait -= dt;
      if (dk.hopWait <= 0) { dk.hop = 1; dk.hopWait = rand(1.3, 2.6); }
      dk.hop = Math.max(0, dk.hop - dt * 3.4);
      const look = clamp((d.x - dk.x) * 0.006, -0.28, 0.28);
      dk.tilt += (look - dk.tilt) * Math.min(1, 6 * dt);

      const sy = dk.y - this.cam;
      if (!dk.greeted && sy > 0 && sy < H - 20) {
        dk.greeted = true;
        dk.hop = 1;
        this.particles.push(new Particle(dk.x, dk.y - 10, 0, 0, 0.45, 5, 'rgba(255,236,150,0.9)', 'ring'));
        Sfx.peep();
      }

      if (Math.abs(dk.x - d.x) < 24 && Math.abs(dk.y - d.y) < 26 &&
          this.ducklings.length < MAX_DUCKLINGS) {
        s.duckling = null;
        const baby = new Duckling(dk.x, dk.y);
        this.ducklings.push(baby);
        baby.slot = this.ducklings.length;
        this.run.rescued++;
        this.dkPop = 1;
        d.cheer = 1;
        Sfx.chick();
        Haptics.buzz(12);
        for (let i = 0; i < 8; i++) {
          this.particles.push(new Particle(
            dk.x, dk.y, rand(-70, 70), rand(-70, 70), rand(0.3, 0.55), rand(1.4, 2.4),
            pick(['#ffe9a0','#ffd233','#ffffff']), 'dust'));
        }
        this.particles.push(new Particle(dk.x, dk.y, 0, 0, 0.4, 8, 'rgba(255,225,120,0.95)', 'ring'));
        this.popups.push({ x: dk.x, y: dk.y - 14, kind: 'plusduck', t: 0, life: 0.55 });
      }
    }
  }

  /* Ducklings hold a loose FLOCK behind the mother rather than replaying her
     exact path - path replay is what made the line snake around like a worm. */
  updateDucklings(dt, moving, follow) {
    const count = this.ducklings.length;
    const hug = this.familyT > 0 ? Math.sin((1 - this.familyT / FAMILY_DUR) * Math.PI) : 0;

    const tail = count ? this.ducklings[count - 1] : null;
    const onRoad = this.world.kindAt(this.duck.y) === 'road' ||
                   this.world.kindAt(this.duck.y - 14) === 'road' ||
                   (tail && this.world.kindAt(tail.y) === 'road');
    this.formation += ((onRoad ? 1 : 0) - this.formation) * Math.min(1, 5.5 * dt);

    const cols = count <= 1 ? 1 : (count <= 4 ? 2 : 3);
    const rowGap = lerp(ROW_GAP_GRASS, ROW_GAP_ROAD, this.formation) * (1 - 0.22 * hug);
    const colGap = lerp(COL_GAP_GRASS, COL_GAP_ROAD, this.formation) * (1 - 0.15 * hug);

    for (let i = 0; i < count; i++) {
      const dk = this.ducklings[i];
      dk.slot += ((i + 1) - dk.slot) * Math.min(1, DK_SLOT_K * dt);

      if (follow) {
        const idx = dk.slot - 1;
        const row = Math.floor(idx / cols) + 1;
        const colIdx = idx - (row - 1) * cols;
        const colOff = cols === 1 ? 0 : (colIdx - (cols - 1) / 2) * colGap;
        const wob = Math.sin(this.time * 2.2 + dk.wob) * 1.8;
        const tx = clamp(this.duck.x + colOff + wob, EDGE - 4, W - EDGE + 4);
        const ty = this.duck.y + row * rowGap;
        const px = dk.x;
        const k = 1 - Math.exp(-dk.follow * dt);
        dk.x += (tx - dk.x) * k;
        dk.y += (ty - dk.y) * Math.min(1, k * 1.5);
        const drift = dt > 0 ? (dk.x - px) / dt : 0;
        dk.tilt += ((clamp(drift / 240, -1, 1) * 0.26) - dk.tilt) * Math.min(1, 12 * dt);
      }

      dk.phase += dt * (moving ? dk.bobRate : 2.2);
      if (dk.hopWait >= 0) {
        dk.hopWait -= dt;
        if (dk.hopWait <= 0) { dk.hop = 1; dk.hopWait = -1; }
      }
      dk.hop = Math.max(0, dk.hop - dt * 3.2);
      dk.dangerT = Math.max(0, dk.dangerT - dt);
      dk.dangerCd = Math.max(0, dk.dangerCd - dt);
    }
  }

  collisions() {
    const d = this.duck;
    const dhw = d.hw, dhh = d.hh;
    for (const s of this.world.sections) {
      if (s.kind !== 'road') continue;
      if (d.y < s.top - 40 || d.y > s.bottom + 40) continue;
      for (const ln of s.lanes) {
        const dyGap = Math.abs(ln.cy - d.y) - (14 + dhh);
        if (dyGap > 16) continue;
        for (const v of ln.vehicles) {
          const gy = Math.abs(ln.cy - d.y) - (v.h / 2 - 1 + dhh);
          const gx = Math.abs(v.x - d.x) - (v.w / 2 - 1 + dhw);
          if (gx < 0 && gy < 0) { this.kill(v); return; }
          if (!v.near && gy < 3 && gx >= 0 && gx < BAL.nearGap && this.nearCool <= 0) {
            v.near = true;
            this.registerNearMiss();
          }
        }
      }
    }
    this.babyCollisions();
  }

  /* one shout at a time however many cars, and the combo only survives
     if the next close pass lands inside the window */
  registerNearMiss() {
    this.nearCool = BAL.nearCooldown;
    this.combo = (this.comboT > 0 ? this.combo : 0) + 1;
    this.comboT = BAL.comboWindow;
    this.run.nearMiss++;
    this.run.bestCombo = Math.max(this.run.bestCombo, this.combo);
    const bonus = BAL.comboBonus[Math.min(this.combo, BAL.comboBonus.length - 1)];
    this.run.nearFeathers += BAL.featherPerNear + bonus;
    this.nearT = 0.3;
    this.nearText = 0.9;
    this.nearLabel = this.combo <= 1 ? 'close!'
                   : this.combo === 2 ? 'close x2'
                   : this.combo === 3 ? 'danger x3'
                   : 'crazy x' + this.combo;
    this.duck.startle = 1;
    this.shake = Math.max(this.shake, 0.28);
    Sfx.near(Math.min(this.combo - 1, 3));
    Haptics.buzz(10);
    for (let i = 0; i < 2; i++) {
      this.particles.push(new Particle(this.duck.x + rand(-6, 6), this.duck.y + rand(-4, 4),
        rand(-50, 50), rand(-40, 10), rand(0.4, 0.7), rand(1.2, 2), C.duck, 'feather'));
    }
  }

  babyCollisions() {
    for (let i = this.ducklings.length - 1; i >= 0; i--) {
      const dk = this.ducklings[i];
      let hitBy = null;
      for (const s of this.world.sections) {
        if (s.kind !== 'road') continue;
        if (dk.y < s.top - 36 || dk.y > s.bottom + 36) continue;
        for (const ln of s.lanes) {
          if (Math.abs(ln.cy - dk.y) > 26) continue;
          for (const v of ln.vehicles) {
            const gy = Math.abs(ln.cy - dk.y) - (v.h * BABY_CAR_H / 2 + DK_HH);
            const gx = Math.abs(v.x - dk.x) - (v.w * BABY_CAR_W / 2 + DK_HW);
            if (gx < 0 && gy < 0) { hitBy = v; break; }
            if (dk.dangerCd <= 0 && dk.lastScare !== v.id && gy < 3 && gx >= 0 && gx < 10) {
              dk.lastScare = v.id;
              dk.dangerCd = 1.1;
              dk.dangerT = 0.55;
              dk.hop = 1;
              if (this.peepCool <= 0) {
                this.peepCool = 0.4;
                Sfx.peep();
                Sfx.whoosh(0.02);
              }
            }
          }
          if (hitBy) break;
        }
        if (hitBy) break;
      }
      if (hitBy) this.loseDuckling(i, hitBy);
    }
  }

  loseDuckling(i, v) {
    const dk = this.ducklings[i];
    this.ducklings.splice(i, 1);
    this.run.lost++;
    this.dkHurt = 1;
    this.freeze = Math.max(this.freeze, 0.04);
    this.shake = Math.max(this.shake, 0.42);
    const dir = v ? v.dir : 1;
    this.knocked.push(new KnockedDuckling(dk.x, dk.y, dir));
    const n = randInt(4, 7);
    for (let f = 0; f < n; f++) {
      const a = rand(0, TAU), sp = rand(40, 130);
      this.particles.push(new Particle(dk.x, dk.y,
        Math.cos(a) * sp + dir * 45, Math.sin(a) * sp,
        rand(0.4, 0.8), rand(1.3, 2.4), Math.random() < 0.7 ? C.duck : C.duckWing, 'feather'));
    }
    let labelled = false;
    for (const p of this.popups) {
      if (p.kind === 'text' && p.t < 0.3 && Math.abs(p.x - dk.x) < 40) { labelled = true; break; }
    }
    if (!labelled) {
      this.popups.push({ x: dk.x, y: dk.y - 13, kind: 'text',
        text: Math.random() < 0.5 ? 'bonk!' : 'oh no!', t: 0, life: 0.62 });
    }
    Sfx.babyHit();
    Haptics.buzz(18);
  }

  kill(v) {
    this.state = 'crash';
    this.deadT = 0;
    this.freeze = 0.08;
    this.shake = 1;
    const d = this.duck;
    const hitDir = v ? v.dir : 1;
    d.spin = hitDir * rand(9, 13);
    d.vx = hitDir * rand(90, 150);
    d.knockY = rand(-20, 30);
    Sfx.crash();
    Haptics.buzz(45);
    this.particles.push(new Particle(d.x, d.y, 0, 0, 0.45, 10, 'rgba(255,255,255,0.9)', 'ring'));
    for (let i = 0; i < 12; i++) {
      const a = rand(0, TAU), sp = rand(50, 180);
      this.particles.push(new Particle(
        d.x, d.y, Math.cos(a) * sp, Math.sin(a) * sp,
        rand(0.5, 0.95), rand(1.6, 3), Math.random() < 0.7 ? C.duck : C.duckWing, 'feather'));
    }
    this.bankRun();
    if (!this.sent) { this.sent = true; Board.submit(this.score, this.run.time); }
  }

  /* Everything a run earned is committed here, exactly once. Nothing else
     touches the save during a run, so no reward can be granted twice. */
  bankRun() {
    if (this.banked) return;
    this.banked = true;
    const s = Save.data, r = this.run;

    r.beatBest = s.best > 0 && this.score > s.best;
    r.soClose  = s.best > 0 && this.score === s.best - 1;

    let earned = this.score * BAL.featherPerRoad
               + r.rescued * BAL.featherPerRescue
               + r.nearFeathers;

    s.runs++;
    s.totalRoads += this.score;
    s.totalRescued += r.rescued;
    s.totalLost += r.lost;
    s.totalNear += r.nearMiss;
    s.bestCombo = Math.max(s.bestCombo, r.bestCombo);
    if (this.score > s.best) { s.best = this.score; this.newBest = true; }

    // missions: progress, then reward and replace any that finished
    for (let i = 0; i < s.missions.length; i++) {
      const m = s.missions[i];
      const def = Save.missionDef(m.id);
      if (!def) continue;
      const val = this.missionValue(def, r, s);
      m.prog = def.kind.indexOf('total') === 0 ? val : Math.max(m.prog, val);
      if (m.prog >= def.goal) {
        earned += BAL.missionReward;
        this.doneMissions.push(def.text);
        s.missions[i] = null;
      }
    }
    s.missions = s.missions.filter(Boolean);
    Save.refillMissions();

    // achievements: each fires once, ever
    for (const a of ACHIEVEMENTS) {
      if (s.achievements.indexOf(a.id) >= 0) continue;
      let hit = false;
      try { hit = !!a.check(s, r); } catch (e) { hit = false; }
      if (hit) {
        s.achievements.push(a.id);
        earned += BAL.achievementReward;
        this.doneAch.push(a.text);
      }
    }

    // ducks that are earned rather than bought open up as soon as their
    // achievement lands, so the reward is never stranded behind a paywall
    for (const dk of DUCKS) {
      if (dk.need && s.achievements.indexOf(dk.need) >= 0 && s.unlocked.indexOf(dk.id) < 0) {
        s.unlocked.push(dk.id);
        this.doneAch.push('NEW DUCK: ' + dk.name);
      }
    }

    s.feathers += earned;
    this.runFeathers = earned;
    this.deathLine = r.soClose ? 'SO CLOSE!'
                   : (Math.random() < 0.65 ? pick(DEATH_LINES) : '');
    Save.write();
  }

  missionValue(def, r, s) {
    switch (def.kind) {
      case 'runScore':     return this.score;
      case 'runRescued':   return r.rescued;
      case 'runNear':      return r.nearMiss;
      case 'runCombo':     return r.bestCombo;
      case 'runTime':      return Math.floor(r.time);
      case 'totalRoads':   return s.totalRoads;
      case 'totalRescued': return s.totalRescued;
      case 'beatBest':     return r.beatBest ? 1 : 0;
    }
    return 0;
  }

  /* ---------- menu actions ---------- */
  openDucks(from) {
    this.state = 'ducks';
    this.menu.from = from;
    this.menu.sel = Save.data.equipped;
  }
  closeDucks() { this.state = this.menu.from === 'over' ? 'over' : 'title'; }
  duckAction() {
    const d = DUCKS.find(x => x.id === this.menu.sel);
    if (!d) return;
    if (Save.has(d.id)) {
      Save.data.equipped = d.id;
      Save.write();
      Sfx.coin();
      return;
    }
    if (d.need) return;                                   // achievement locked
    if (Save.data.feathers < d.cost) return;              // cannot afford
    Save.data.feathers -= d.cost;
    Save.data.unlocked.push(d.id);
    Save.data.equipped = d.id;
    Save.write();
    this.menu.reveal = 1.1;
    this.menu.revealId = d.id;
    Sfx.unlock();
    Haptics.buzz(30);
  }

  /* ---------- draw ---------- */
  draw() {
    ctx.setTransform(viewScaleX, 0, 0, viewScaleY, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = C.grass;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (this.shake > 0) {
      const m = this.shake * this.shake * 7;
      ctx.translate(rand(-m, m), rand(-m, m));
    }

    const cam = this.cam - Math.sin(this.camPush * Math.PI) * 2.2;
    for (const s of this.world.sections) drawSection(s, cam);

    for (const s of this.world.sections) {
      if (s.kind !== 'road') continue;
      if (s.bottom - cam < -40 || s.top - cam > H + 40) continue;
      for (const ln of s.lanes) {
        const sy = ln.cy - cam;
        if (sy < -40 || sy > H + 40) continue;
        for (const v of ln.vehicles) drawVehicle(v, sy, this.time);
      }
    }

    for (const s of this.world.sections) {
      const dk = s.duckling;
      if (!dk) continue;
      const y = dk.y - cam;
      if (y < -30 || y > H + 30) continue;
      const hop = Math.sin(dk.hop * Math.PI) * 5;
      ctx.save();
      ctx.globalAlpha = 0.4 + 0.3 * Math.sin(this.time * 4 + dk.phase);
      ctx.strokeStyle = '#fff6c4'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(dk.x, y, 15, 0, TAU); ctx.stroke();
      ctx.restore();
      drawDuck(dk.x, y - hop, dk.tilt, dk.phase, 0.6, 1);
    }

    for (let i = this.ducklings.length - 1; i >= 0; i--) {
      const dk = this.ducklings[i];
      const y = dk.y - cam;
      if (y < -30 || y > H + 30) continue;
      drawDuck(dk.x, y - Math.sin(dk.hop * Math.PI) * 4, dk.tilt, dk.phase, DK_SCALE, 1);
    }
    const shouted = [];
    for (let i = 0; i < this.ducklings.length; i++) {
      const dk = this.ducklings[i];
      if (dk.dangerT <= 0) continue;
      const y = dk.y - cam;
      if (y < -30 || y > H + 30) continue;
      let crowded = false;
      for (const s of shouted) {
        if (Math.abs(s.x - dk.x) < 16 && Math.abs(s.y - y) < 22) { crowded = true; break; }
      }
      if (crowded) continue;
      shouted.push({ x: dk.x, y: y });
      const side = dk.x > W - 40 ? -13 : 13;
      drawBang(dk.x + side, y - 5 - Math.sin(dk.hop * Math.PI) * 4, dk.dangerT / 0.55);
    }

    for (const k of this.knocked) {
      const y = k.y - cam;
      if (y < -40 || y > H + 40) continue;
      drawDuck(k.x, y, k.angle, k.phase, DK_SCALE, k.alpha);
    }

    for (const p of this.particles) if (p.kind === 'dust') drawParticle(p, cam);

    const d = this.duck;
    const cheerLift = Math.sin(d.cheer * Math.PI) * 3;
    drawDuck(d.x, d.y - cam - cheerLift,
             d.angle + (this.state === 'playing' || this.state === 'title' ? d.tilt : 0),
             d.phase, 1, 1, Save.data.equipped, d.startle);

    for (const p of this.particles) if (p.kind !== 'dust') drawParticle(p, cam);

    for (const p of this.popups) {
      const y = p.y - cam;
      if (y < -20 || y > H + 20) continue;
      const a = Math.min(1, (1 - p.t / p.life) * 2.4);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.textBaseline = 'middle';
      if (p.kind === 'text') {
        setFont(13);
        ctx.fillStyle = C.accent;
        textLS(p.text, p.x, y, 0.8, 'center', 4, 'rgba(255,255,255,0.95)');
        ctx.fillStyle = C.accent;
        textLS(p.text, p.x, y, 0.8, 'center', 0, '');
      } else {
        setFont(14);
        ctx.fillStyle = C.ink;
        textLS('+', p.x - 8, y, 0, 'center', 4, 'rgba(255,255,255,0.95)');
        ctx.fillStyle = C.ink;
        textLS('+', p.x - 8, y, 0, 'center', 0, '');
        ctx.restore();
        drawDuck(p.x + 5, y, 0, this.time * 5, 0.44, a);
        continue;
      }
      ctx.restore();
    }

    if (this.nearText > 0 && this.state === 'playing') {
      const k = this.nearText / 0.9;
      ctx.save();
      ctx.globalAlpha = Math.min(1, k * 1.6);
      setFont(this.combo >= 3 ? 15 : 13);
      ctx.textBaseline = 'middle';
      const yy = d.y - cam - 26 - (1 - k) * 14;
      const col = this.combo >= 4 ? '#ff2d1f' : this.combo >= 3 ? '#ff7a1f' : C.accent;
      ctx.fillStyle = col;
      textLS(this.nearLabel, d.x, yy, 1, 'center', 4, 'rgba(255,255,255,0.95)');
      ctx.fillStyle = col;
      textLS(this.nearLabel, d.x, yy, 1, 'center', 0, '');
      ctx.restore();
    }
    ctx.restore();

    if (this.nearT > 0) {
      ctx.save();
      ctx.globalAlpha = (this.nearT / 0.3) * 0.5;
      ctx.strokeStyle = '#fff3d2'; ctx.lineWidth = 6;
      ctx.strokeRect(3, 3, W - 6, H - 6);
      ctx.restore();
    }

    if (this.state === 'ducks') { this.drawDucksScreen(); return; }

    this.drawHud();
    this.drawOverlays();
  }

  drawHud() {
    const s = Save.data;
    const sc = 1 + this.pop * 0.4;
    const oneAway = this.state === 'playing' && s.best > 0 &&
                    !this.beatBest && this.score === s.best - 1;
    ctx.save();
    ctx.translate(W / 2, 40);
    ctx.scale(sc, sc);
    bigFont(34);
    ctx.textBaseline = 'middle';
    if (oneAway) {
      ctx.save();
      ctx.globalAlpha = 0.30 + 0.30 * Math.sin(this.time * 5);
      ctx.fillStyle = C.gold;
      textLS(this.score, 0, 0, 1, 'center', 12, 'rgba(255,190,70,0.95)');
      ctx.restore();
    }
    ctx.fillStyle = C.ink;
    textLS(this.score, 0, 0, 1, 'center', 7, 'rgba(255,255,255,0.9)');
    ctx.fillStyle = oneAway ? '#a35410' : C.ink;
    textLS(this.score, 0, 0, 1, 'center', 0, '');
    ctx.restore();

    // a quiet target to chase
    if (s.best > 0 && this.state !== 'over') {
      setFont(11);
      ctx.textBaseline = 'middle';
      ctx.fillStyle = this.beatBest ? C.gold : 'rgba(43,52,64,0.55)';
      textLS(this.beatBest ? 'BEST ' + this.score : 'BEST ' + s.best, W / 2, 74, 1.5, 'center',
             3, 'rgba(255,255,255,0.8)');
      ctx.fillStyle = this.beatBest ? '#a35410' : 'rgba(43,52,64,0.55)';
      textLS(this.beatBest ? 'BEST ' + this.score : 'BEST ' + s.best, W / 2, 74, 1.5, 'center', 0, '');
    }

    if (this.recordT > 0) {
      const k = 1 - this.recordT;
      ctx.save();
      ctx.globalAlpha = (1 - k) * 0.9;
      ctx.strokeStyle = C.gold; ctx.lineWidth = 2.5 * (1 - k) + 0.5;
      ctx.beginPath(); ctx.arc(W / 2, 40, 20 + k * 26, 0, TAU); ctx.stroke();
      ctx.fillStyle = C.gold;
      for (let i = 0; i < 6; i++) {
        const a = i * TAU / 6 + k * 0.7;
        const r = 16 + k * 30;
        dot(W / 2 + Math.cos(a) * r, 40 + Math.sin(a) * r, 2.6 * (1 - k));
      }
      ctx.restore();
    }

    const n = this.ducklings.length;
    if (this.dkHurt > 0) {
      ctx.save();
      ctx.globalAlpha = this.dkHurt * 0.65;
      ctx.strokeStyle = C.accent; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(24, 26, 12 + (1 - this.dkHurt) * 8, 0, TAU); ctx.stroke();
      ctx.restore();
    }
    if (n > 0) {
      const bs = 1 + this.dkPop * 0.45 - this.dkHurt * 0.18;
      ctx.save();
      ctx.translate(24, 26); ctx.scale(bs, bs); ctx.translate(-24, -26);
      drawDuck(24, 26, 0, this.time * 3, 0.5, 0.95);
      setFont(13);
      ctx.textBaseline = 'middle';
      ctx.fillStyle = C.ink;
      textLS('x' + n, 38, 27, 0.5, 'left', 4, 'rgba(255,255,255,0.9)');
      ctx.fillStyle = this.dkHurt > 0.4 ? C.accent : C.ink;
      textLS('x' + n, 38, 27, 0.5, 'left', 0, '');
      ctx.restore();
    }

    // siren warning arrow on the side the ambulance is coming from
    if (this.sirenT > 0) {
      const a = Math.min(1, this.sirenT / 0.4) * (0.55 + 0.45 * Math.sin(this.time * 14));
      const x = this.sirenSide > 0 ? 16 : W - 16;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = Math.floor(this.time * 8) % 2 === 0 ? '#ff3b30' : '#3b6bff';
      ctx.beginPath();
      ctx.moveTo(x + this.sirenSide * 9, H / 2);
      ctx.lineTo(x - this.sirenSide * 7, H / 2 - 11);
      ctx.lineTo(x - this.sirenSide * 7, H / 2 + 11);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    if (this.toast > 0 && this.state === 'playing') {
      const a = Math.min(1, this.toast / 0.4);
      ctx.save();
      ctx.globalAlpha = a;
      setFont(13);
      ctx.textBaseline = 'middle';
      ctx.fillStyle = C.gold;
      textLS(this.toastText, W / 2, 92, 1.5, 'center', 4, 'rgba(255,255,255,0.9)');
      ctx.fillStyle = '#a35410';
      textLS(this.toastText, W / 2, 92, 1.5, 'center', 0, '');
      ctx.restore();
    }

    drawSpeaker(W - 22, 24, Sfx.muted);
  }

  /* buttons are laid out here so input and drawing can never disagree */
  layout() {
    return {
      ducksBtn: { x: W / 2 - 52, y: H - 42, w: 104, h: 30 },
      close:    { x: W - 42, y: 12, w: 30, h: 30 },
      action:   { x: W / 2 - 70, y: 394, w: 140, h: 34 },
      sound:    { x: 16, y: 436, w: 92, h: 26 },
      haptic:   { x: 116, y: 436, w: 96, h: 26 }
    };
  }
  duckCell(i) {
    const col = i % 3, row = Math.floor(i / 3);
    return { x: 18 + col * 120, y: 78 + row * 100, w: 120, h: 100 };
  }

  drawOverlays() {
    const L = this.layout();

    if (this.state === 'title' && this.overlay > 0.01) {
      const a = this.overlay;
      ctx.save();
      ctx.globalAlpha = a * 0.38;
      ctx.fillStyle = '#fffaf0';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();

      const dy = this.duck.y - this.cam;
      const pulse = 4 + Math.sin(this.time * 3.4) * 4;
      drawChevron(this.duck.x - 30 - pulse, dy, -1, 8, a * 0.6);
      drawChevron(this.duck.x + 30 + pulse, dy,  1, 8, a * 0.6);

      ctx.save();
      ctx.globalAlpha = a;
      ctx.textBaseline = 'middle';
      bigFont(17);
      ctx.fillStyle = C.ink;
      textLS('DRAG TO STEER', W / 2, dy + 74, 3, 'center', 6, 'rgba(255,255,255,0.9)');
      ctx.fillStyle = C.ink;
      textLS('DRAG TO STEER', W / 2, dy + 74, 3, 'center', 0, '');
      setFont(11, 400);
      ctx.fillStyle = '#55605c';
      textLS('keys, slider or finger', W / 2, dy + 96, 1, 'center', 4, 'rgba(255,255,255,0.85)');
      ctx.fillStyle = '#55605c';
      textLS('keys, slider or finger', W / 2, dy + 96, 1, 'center', 0, '');
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = a;
      drawButton(L.ducksBtn, 'DUCKS', C.blue);
      this.drawFeatherCount(W - 20, H - 27, 'right');
      ctx.restore();
    }

    if (this.state === 'over' && this.overlay > 0.01) {
      const a = this.overlay;
      const s = Save.data;
      ctx.save();
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = '#2b3440';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();

      const showFamily = this.run.rescued > 0;
      const mission = this.nextMissionLine();
      const showBoard = Board.on && Board.top && Board.top.length;
      const bw = 286;
      const bh = 178 + (this.deathLine ? 18 : 0) + (showFamily ? 20 : 0)
               + (mission ? 20 : 0) + (showBoard ? 20 + Board.top.length * 15 : 0);
      const bx = (W - bw) / 2, by = clamp(H / 2 - bh / 2 - 10 + (1 - a) * 14, 8, H - bh - 46);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(20,26,34,0.28)';
      rr(bx + 4, by + 6, bw, bh, 14); ctx.fill();
      ctx.fillStyle = C.paper;
      ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
      rr(bx, by, bw, bh, 14); ctx.fill(); ctx.stroke();
      ctx.save();
      rr(bx, by, bw, bh, 14); ctx.clip();
      ctx.fillStyle = this.newBest ? C.gold : C.accent;
      ctx.fillRect(bx, by, bw, 40);
      ctx.restore();
      rr(bx, by, bw, bh, 14); ctx.stroke();

      ctx.textBaseline = 'middle';
      let y = by + 21;
      bigFont(20);
      ctx.fillStyle = '#fff';
      textLS(this.newBest ? 'NEW BEST!' : 'DUCK DOWN!', W / 2, y, 2, 'center', 0, '');

      if (this.deathLine) {
        y += 30;
        setFont(11);
        ctx.fillStyle = '#9a9384';
        textLS(this.deathLine, W / 2, y, 1, 'center', 0, '');
        y += 14;
      } else { y += 30; }

      y += 20;
      bigFont(26);
      ctx.fillStyle = C.ink;
      textLS(this.score + (this.score === 1 ? ' road' : ' roads'), W / 2, y, 1, 'center', 0, '');

      y += 24;
      setFont(12);
      ctx.fillStyle = C.mute;
      textLS('BEST ' + s.best, W / 2, y, 2.5, 'center', 0, '');

      if (showFamily) {
        y += 20;
        const txt = this.run.lost > 0
          ? (this.ducklings.length + ' safe \u00B7 ' + this.run.lost + ' lost')
          : (this.ducklings.length + ' safe');
        setFont(12);
        const tw = textWidth(txt, 0.5);
        const startX = W / 2 - (tw + 17) / 2;
        drawDuck(startX + 6, y, 0, this.time * 3, 0.5, 1);
        ctx.fillStyle = this.run.lost > 0 ? '#a2704f' : C.mute;
        textLS(txt, startX + 17, y + 1, 0.5, 'left', 0, '');
      }

      // feathers earned this run
      y += 22;
      setFont(13);
      const ftxt = '+' + this.runFeathers;
      const fw = textWidth(ftxt, 0.5);
      drawFeather(W / 2 - fw / 2 - 8, y, 1, '#dfeaf2');
      ctx.fillStyle = C.ink;
      textLS(ftxt, W / 2 - fw / 2 + 3, y, 0.5, 'left', 0, '');

      if (mission) {
        y += 20;
        setFont(11);
        ctx.fillStyle = mission.done ? '#3f9e4d' : C.mute;
        textLS(mission.text, W / 2, y, 0.5, 'center', 0, '');
      }

      if (showBoard) {
        y += 20;
        setFont(11);
        ctx.fillStyle = C.blue;
        textLS('WORLD TOP', W / 2, y, 2, 'center', 0, '');
        y += 15;
        for (let i = 0; i < Board.top.length; i++) {
          const e = Board.top[i];
          ctx.fillStyle = '#6c7468';
          textLS((i + 1) + '. ' + String(e.name || '').slice(0, 10), bx + 16, y, 0.4, 'left', 0, '');
          ctx.fillStyle = C.ink;
          textLS(e.score, bx + bw - 16, y, 0.4, 'right', 0, '');
          y += 15;
        }
        if (Board.rank) {
          ctx.fillStyle = C.accent;
          textLS('you #' + Board.rank, W / 2, y, 0.5, 'center', 0, '');
        }
      }

      y = by + bh - 18;
      ctx.globalAlpha = a * (0.55 + 0.45 * (0.5 + 0.5 * Math.sin(this.time * 3.6)));
      setFont(12, 400);
      ctx.fillStyle = C.mute;
      textLS('tap to try again', W / 2, y, 1.5, 'center', 0, '');
      ctx.globalAlpha = a;

      drawButton(L.ducksBtn, 'DUCKS', C.blue);
      this.drawFeatherCount(W - 20, H - 27, 'right');
      ctx.restore();
    }
  }

  /* the single most useful mission line: the one closest to done */
  nextMissionLine() {
    if (this.doneMissions.length) return { text: 'MISSION DONE: ' + this.doneMissions[0], done: true };
    const s = Save.data;
    let best = null, bestRatio = -1;
    for (const m of s.missions) {
      const def = Save.missionDef(m.id);
      if (!def) continue;
      const ratio = clamp(m.prog / def.goal, 0, 1);
      if (ratio > bestRatio) { bestRatio = ratio; best = { def, m }; }
    }
    if (!best) return null;
    return { text: best.def.text + '  ' + Math.min(best.m.prog, best.def.goal) + '/' + best.def.goal,
             done: false };
  }

  drawFeatherCount(x, y, align) {
    setFont(13);
    ctx.textBaseline = 'middle';
    const t = String(Save.data.feathers);
    const w = textWidth(t, 0.5);
    const tx = align === 'right' ? x - w : x;
    drawFeather(tx - 9, y, 1, '#dfeaf2');
    ctx.fillStyle = C.ink;
    textLS(t, tx, y, 0.5, 'left', 3, 'rgba(255,255,255,0.85)');
    ctx.fillStyle = C.ink;
    textLS(t, tx, y, 0.5, 'left', 0, '');
  }

  drawDucksScreen() {
    const L = this.layout();
    const s = Save.data;
